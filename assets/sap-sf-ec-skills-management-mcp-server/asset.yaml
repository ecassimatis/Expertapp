apiVersion: asset.sap/v1
kind: Asset
type: mcp-server

metadata:
  name: sap-sf-ec-skills-management-mcp-server
  description: Exposes SAP SuccessFactors Employee Central Skills Management data as read-only MCP tools for retrieving employee skills, certifications, job roles, and competency data needed for expert matching.
  version: "1.0.0"
  translation: mcp-translation/translation.json
  apiSpec: mcp-translation/api-spec.edmx

requires:
  - name: ECSkillsManagement
    kind: api
    ordId: sap.sf:apiResource:ECSkillsManagement:v1

provides:
  apis:
    - name: sap-sf-ec-skills-management-mcp-server
      kind: mcp-server
      ordId: customer.build:apiResource:expert-finder-3f96c.sap-sf-ec-skills-management-mcp-server:v1
