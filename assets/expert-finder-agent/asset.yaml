apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: expert-finder-agent
  description: AI agent that finds qualified, unconflicted SAP internal experts by domain for partner and ecosystem reviews. Applies seniority and conflict-of-interest filters and enriches results with external signals.
  version: "1.0.0"

provides:
  apis:
    - name: expert-finder-agent
      kind: a2a
      ordId: customer.build:apiResource:expert-finder-3f96c.expert-finder-agent:v1

requires:
  - name: sap-sf-ec-employee-profile-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:expert-finder-3f96c.sap-sf-ec-employee-profile-mcp-server:v1
  - name: sap-sf-ec-skills-management-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:expert-finder-3f96c.sap-sf-ec-skills-management-mcp-server:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
